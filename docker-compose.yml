version: '3.8'

services:
  nexus-app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    container_name: nexus
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # This uses a bind mount to map the local ./server/data directory
      # to the container. This makes config.json directly accessible on the host.
      - ./server/data:/app/server/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/config"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
